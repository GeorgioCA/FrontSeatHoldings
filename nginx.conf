server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/html text/css text/javascript application/javascript application/json image/svg+xml;

    # Favicon / robots
    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }
    location = /robots.txt {
        log_not_found off;
        access_log off;
    }

    # Brand assets — long cache
    location /brand/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Image assets — long cache
    location /img/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # HTML — no cache
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # SVG / fonts — medium cache
    location ~* \.(svg|woff2?|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # Main site
    location / {
        try_files $uri $uri/ =404;
    }

    # About page
    location = /about {
        try_files /about.html =404;
    }

    # Careers page
    location = /careers {
        try_files /careers.html =404;
    }

    # French homepage
    location = /fr {
        try_files /fr.html =404;
    }

    # French about page
    location = /fr/a-propos {
        try_files /a-propos.html =404;
    }

    # French careers
    location = /carrieres {
        try_files /carrieres.html =404;
    }

    # Contact page
    location = /contact {
        try_files /contact.html =404;
    }

    # French contact page
    location = /fr/contact {
        try_files /contact-fr.html =404;
    }

    # Health check — lightweight, no log noise
    location = /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    # Custom 404
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
